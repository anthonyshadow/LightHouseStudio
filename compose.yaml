name: lightframe-studio-development

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: lightframe_development
      POSTGRES_USER: lightframe
      POSTGRES_PASSWORD: lightframe-local-development
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - lightframe-postgres-development:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lightframe -d lightframe_development']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  lightframe-postgres-development:
