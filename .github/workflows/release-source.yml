name: Release Source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  release-source:
    name: Release Source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the protected develop branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_BRANCH" = develop
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
