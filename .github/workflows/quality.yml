name: Quality

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  quality:
    name: Essential checks, tests, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: bun run audit:all
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'bun.lock') }}-
      - run: bun run quality
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: bun run test:production
      - name: Upload unit failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-failure-report
          path: test-results/unit/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Unit coverage
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: bun run test:coverage
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: bun run test:e2e
        env:
          LIGHTFRAME_ENV_SOURCE: process
          NODE_ENV: development
          DATABASE_MODE: postgres
          DATABASE_URL: postgresql://lightframe:lightframe-local-development@127.0.0.1:5433/lightframe_development
          ASSET_STORE_PROVIDER: r2
          R2_ACCOUNT_ID: 0123456789abcdef0123456789abcdef
          R2_ACCESS_KEY_ID: ci-fake-access-key
          R2_SECRET_ACCESS_KEY: ci-fake-secret-key
          R2_BUCKET: lightframe-studio-development
          AUTH_JWT_SECRET: lightframe-ci-signing-key-with-at-least-32-characters
      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Development PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lightframe_development
          POSTGRES_USER: lightframe
          POSTGRES_PASSWORD: lightframe-local-development
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lightframe -d lightframe_development"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      LIGHTFRAME_ENV_SOURCE: process
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://lightframe:lightframe-local-development@127.0.0.1:5433/lightframe_development
      ASSET_STORE_PROVIDER: r2
      R2_ACCOUNT_ID: 0123456789abcdef0123456789abcdef
      R2_ACCESS_KEY_ID: ci-fake-access-key
      R2_SECRET_ACCESS_KEY: ci-fake-secret-key
      R2_BUCKET: lightframe-studio-development
      AUTH_JWT_SECRET: lightframe-ci-signing-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: bun run db:migrate:development
      - run: bun run --filter @studio/api db:check
      - run: bun run db:smoke:development
      - name: Run PostgreSQL migration and repository integration tests
        run: >-
          ./node_modules/.bin/vitest run
          apps/api/src/infrastructure/database/project-migration.postgres.integration.test.ts
          apps/api/src/infrastructure/database/project-repository.postgres.integration.test.ts
          apps/api/src/infrastructure/database/campaign-migration.postgres.integration.test.ts
          apps/api/src/infrastructure/database/campaign-repository.postgres.integration.test.ts

  visual:
    name: Curated visual regression
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: bun run test:visual
      - name: Upload visual failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-failures
          path: |
            playwright-report/visual/
            test-results/visual/
          if-no-files-found: ignore
          retention-days: 14

  broad-captures:
    name: Broad screenshot artifact
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: bun run screenshots:capture
      - name: Upload broad captures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: broad-studio-captures
          path: test-results/captures/
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality
    if: ${{ always() }}
    needs:
      - quality
      - e2e
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Quality jobs
        env:
          ESSENTIAL_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$ESSENTIAL_RESULT" = success
          test "$E2E_RESULT" = success
          test "$DATABASE_RESULT" = success
