name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  quality:
    name: Essential checks, tests, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun ci
      - run: bun run audit:all
      - run: bun run quality
      - run: bun run test:production
      - name: Upload unit failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-failure-report
          path: test-results/unit/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Unit coverage
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun ci
      - run: bun run test:coverage
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun ci
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:e2e
      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Curated visual regression
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun ci
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:visual
      - name: Upload visual failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-failures
          path: |
            playwright-report/visual/
            test-results/visual/
          if-no-files-found: ignore
          retention-days: 14

  broad-captures:
    name: Broad screenshot artifact
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun ci
      - run: bunx playwright install --with-deps chromium
      - run: bun run screenshots:capture
      - name: Upload broad captures
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: broad-studio-captures
          path: test-results/captures/
          if-no-files-found: ignore
          retention-days: 14
